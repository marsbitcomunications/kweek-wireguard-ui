name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build React App
        run: |
          cd frontend
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # NEW: Dedicated Linux build using Ubuntu 20.04 for maximum compatibility
  build-linux:
    needs: build-frontend
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip git curl
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/frontend_dist
      - name: Build Linux Binary
        run: |
          cd backend
          pip3 install -r requirements.txt
          pip3 install pyinstaller
          pyinstaller --onefile --name kweek-wireguard-ui-linux-amd64 --add-data "frontend_dist:frontend_dist" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: kweek-wireguard-ui-linux-amd64
          path: backend/dist/kweek-wireguard-ui-linux-amd64

  # Dedicated Mac build
  build-macos:
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/frontend_dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build MacOS Binary
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --name kweek-wireguard-ui-macos-amd64 --add-data "frontend_dist:frontend_dist" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: kweek-wireguard-ui-macos-amd64
          path: backend/dist/kweek-wireguard-ui-macos-amd64

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kweek-wireguard-ui-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kweek-wireguard-ui-linux-amd64
            kweek-wireguard-ui-macos-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
